; Configuration du pont Odoo <-> encodeur EASLOC
; Encodage : UTF-8

[odoo]
; Adresse de votre Odoo (sans / final)
url = http://localhost:8069/odoo
; Clé affichée dans Odoo : Serrures > Configuration > Encodeurs > Clé du pont
api_key = RTk89yhxFb6RqmEb9l3w1Ym3_IWKddyUCGOVVYRfphk
; Mettre false seulement pour un Odoo local en HTTPS avec certificat auto-signé
verify_ssl = true

[bridge]
; Dossier d'installation du logiciel Card Lock System (contient proRFL.dll, d12c.dll…)
; Si besoin, faites un clic droit sur l'icône du logiciel > Ouvrir l'emplacement du fichier
dll_dir = C:\Program Files (x86)\Card Lock System
; auto = détection automatique (essaie 1 puis 0)
fusb = auto
; Secondes entre deux interrogations d'Odoo
poll_interval = 1
; Secondes pendant lesquelles on réessaie si la carte n'est pas encore posée
card_wait = 8
; Durée du bip de confirmation
buzzer = 10
; Code hôtel, uniquement utilisé par --selftest pour décoder une carte
dls_co_id = 0
; Journal (laisser vide pour désactiver)
log_file = easloc_bridge.log
; true = encodeur simulé (tests sans matériel)
simulate = false
